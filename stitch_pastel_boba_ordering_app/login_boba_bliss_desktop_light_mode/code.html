<style>
        body {
            background-color: #fff8f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0px 10px 30px rgba(74, 69, 67, 0.05);
        }
        .boba-pearl {
            width: 12px;
            height: 12px;
            background-color: #864d61;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }
        .pearl-1 { animation-delay: 0s; }
        .pearl-2 { animation-delay: 0.2s; }
        .pearl-3 { animation-delay: 0.4s; }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #fab3ca;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-md">
<!-- Top Bar Placeholder (Navigation Suppressed as per Task-Focused Rule) -->
<header class="fixed top-0 left-0 w-full p-md z-50 flex justify-center">
<div class="font-headline-md text-headline-md font-bold text-primary">Boba Bliss</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[1200px] flex items-center justify-center grow">
<!-- Login Card -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-lg soft-shadow flex flex-col gap-md border border-surface-container-high relative overflow-hidden">
<!-- Atmospheric Aesthetic Element -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-container opacity-20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-secondary-container opacity-30 rounded-full blur-3xl"></div>
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your daily dose of refreshing delight awaits.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" id="loginForm">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">mail</span>
<input class="w-full pl-[52px] pr-md py-md rounded-lg bg-surface-container border-none font-body-md transition-all" id="email" placeholder="hello@bobabliss.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">lock</span>
<input class="w-full pl-[52px] pr-md py-md rounded-lg bg-surface-container border-none font-body-md transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end">
<button class="font-label-sm text-label-sm text-secondary hover:underline" type="button">Forgot password?</button>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-[18px] py-md rounded-lg hover:scale-[0.98] active:scale-95 transition-all duration-200 font-bold" type="submit">
                    Login
                </button>
</form>
<div class="flex items-center gap-md py-xs">
<div class="h-[1px] grow bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR CONTINUE WITH</span>
<div class="h-[1px] grow bg-surface-container-highest"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-md px-md rounded-lg border-2 border-secondary-container text-secondary font-label-md hover:bg-secondary-container transition-colors active:scale-95">
<img alt="Google" class="w-5 h-5 grayscale opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAauS1NkDgKau4fFkSa3DOpQh_YItNn2jypYt9Z34eCY638GVyMYgjr1DwmdCY0jiI2x0IfKLXrXdfJ7CWFjXZW8r5ethuB24wcOOL_2TxOp62J45Dj0naAXyGQe4GucUPkx5nmg94LyxHPN4qS7KcF85bKAi9GjsIrGeFec18wxfT2A__1q9q67eCguwIqz2HKnPwMexpD8wBdMpSgfP1Ob563BiEz5jgOfBpbonxANZNoIe_CzaDTjT3hUm9w5tDEekbDbUOfZzc_"/>

                </button>
<button class="flex items-center justify-center gap-sm py-md px-md rounded-lg border-2 border-secondary-container text-secondary font-label-md hover:bg-secondary-container transition-colors active:scale-95">
<img alt="Apple" class="w-5 h-5 opacity-70" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4FggbnGGKtey0UPyqBgri4gbQWNVcqwiroTITJlKKUOQfeBTtK3CYQvNMF89Lk6CJryBpJNbhI3wRs_9e3pvPWe5Tju0m4pwF0_v_4KmxEPuPsjcuvbcs8yj6BcWs9sK5sUC6oeRWvKOcQaLclGWrYKs1eymRRkJv3wHBzpbS9ETAAe0E3zNncBSwTis-CBDlgo7FkOg_DYZWHmKR-J_BfMPfQGgJIwsga66_3ke5bWeUxG3Oo4tEyWdVZq1uzHGswWquBZDHbHGJ"/>

                </button>
</div>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-sm">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
<!-- Custom Boba Loader (Hidden by default) -->
<div class="hidden absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-sm flex-col items-center justify-center gap-md z-10" id="loader">
<div class="flex gap-xs">
<div class="boba-pearl pearl-1"></div>
<div class="boba-pearl pearl-2"></div>
<div class="boba-pearl pearl-3"></div>
</div>
<span class="font-label-md text-label-md text-primary">Brewing your experience...</span>
</div>
</div>
</main>
<!-- Footer Information (Light version for focused screen) -->
<footer class="w-full max-w-[1200px] p-md flex flex-col md:flex-row justify-between items-center gap-md opacity-60">
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 Boba Bliss. All rights reserved.</p>
<div class="flex gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');
            loader.classList.add('flex');
            
            // Artificial delay to show the "Boba" loader animation
            setTimeout(() => {
                loader.innerHTML = `
                    <span class="material-symbols-outlined text-primary" style="font-size: 48px; font-variation-settings: 'FILL' 1;">check_circle</span>
                    <span class="font-headline-md text-headline-md text-primary">Success!</span>
                `;
                setTimeout(() => {
                    loader.classList.add('hidden');
                    loader.classList.remove('flex');
                }, 1000);
            }, 2000);
        });

        // Small interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#864d61';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#514347';
            });
        });
    </script>
</body></html>
