<body class="bg-background text-on-background min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Hero Background Wrapper -->
<div class="fixed inset-0 z-0 boba-bg" data-alt="A cinematic, out-of-focus close-up of a premium taro boba tea with dark tapioca pearls settling at the bottom of a glass. The scene is bathed in a nocturnal lavender glow with soft bokeh lights in the background creating an atmosphere of mysterious comfort. The overall aesthetic is clean, modern, and high-end, utilizing a deep purple and violet color palette to evoke a sense of late-night luxury and calm.">
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<!-- Auth Container -->
<div class="w-full max-w-[440px] glass-panel glow-shadow rounded-xl overflow-hidden transition-all duration-500 animate-in fade-in zoom-in slide-in-from-bottom-4">
<div class="p-lg md:p-xl space-y-lg">
<!-- Brand Header -->
<div class="text-center space-y-xs">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Boba Bliss</h1>
<p class="font-body-md text-on-surface-variant">Welcome back to the midnight garden.</p>
</div>
<!-- Login Form -->
<form class="space-y-md" onsubmit="event.preventDefault();">
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-on-surface-variant block ml-xs">Email Address</label>
<div class="input-glow flex items-center bg-surface-container rounded-lg border border-outline-variant/30 transition-all duration-200">
<span class="material-symbols-outlined ml-md text-outline" style="font-size: 20px;">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-md px-md text-on-surface placeholder:text-outline/50 font-body-md" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-base">
<div class="flex justify-between items-center px-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant block">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="input-glow flex items-center bg-surface-container rounded-lg border border-outline-variant/30 transition-all duration-200">
<span class="material-symbols-outlined ml-md text-outline" style="font-size: 20px;">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-md px-md text-on-surface placeholder:text-outline/50 font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-title-md text-title-md py-md rounded-lg shadow-lg hover:scale-[1.01] active:scale-95 transition-all duration-200 mt-lg">
                        Login
                    </button>
</form>
<!-- Divider -->
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-container-high px-md text-outline text-[10px] font-bold tracking-widest rounded-full">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm bg-surface-container-high border border-outline-variant/30 hover:bg-surface-variant py-md rounded-lg transition-all duration-200 active:scale-95">
<svg class="w-5 h-5" viewbox="0 0 24 24">

<span class="font-label-md text-label-md">Google</span>
</button>

</p>

<footer class="relative z-10 w-full py-md text-center">
<p class="font-label-sm text-label-sm text-outline/60 tracking-wider">
            © 2024 BOBA BLISS. STEEPED IN MAGIC.
        </p>
</footer>
<!-- Micro-interaction Scripts -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Simple parallax effect for background
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('.boba-bg');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            bg.style.transform = `translate(${x * 10}px, ${y * 10}px) scale(1.05)`;
        });
    </script>
